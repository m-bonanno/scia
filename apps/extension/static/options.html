<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scia — Options</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <form id="form" class="options">
      <div>
        <h1>Pairing with Scia</h1>
        <p class="muted">
          Open Scia, go to Settings, copy the code under “Browser extension” and paste it here.
        </p>
      </div>
      <label>
        Pairing code
        <input id="token" type="text" autocomplete="off" spellcheck="false" />
      </label>
      <label>
        Port
        <input id="port" type="number" min="1" max="65535" />
        <span class="muted" style="font-weight: 400"
          >Leave it as it is unless you changed it in Scia.</span
        >
      </label>
      <label class="check">
        <input id="intercept" type="checkbox" />
        <span>
          Send the browser’s downloads to Scia
          <span class="muted" style="display: block">
            Files from sites that need a login may not start: Scia does not receive your session.
          </span>
        </span>
      </label>
      <div class="actions">
        <button type="submit">Save and check</button>
        <p id="result" role="status"></p>
      </div>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
