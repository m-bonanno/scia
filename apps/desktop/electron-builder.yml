# CI injects the version (-c.extraMetadata.version); package.json stays 0.0.0.
# Kept equal to APP_ID of src/engine/app-identity.ts by its spec — change both together.
appId: app.scia.desktop
productName: Scia
copyright: Copyright © 2026 Scia
# A one-click install for the user goes to Programs\<this name>; the workspace's own name,
# @scia/desktop, would make it @sciadesktop. Kept equal to productName, lower-case, by
# src/engine/app-identity.test.ts. The app's name and its data folder come from productName.
extraMetadata:
  name: scia

directories:
  output: release
  buildResources: build

# main and preload are self-contained bundles: no node_modules in the asar.
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
npmRebuild: false
nodeGypRebuild: false

# The installed exe never runs as plain Node (the engine is a utilityProcess), ignores
# NODE_OPTIONS and loads its code from app.asar only.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true

# Fetches the programs shipped beside the engine for the system being packed, at the version and
# checksum fixed in it (docs/adr/0008).
beforePack: scripts/fetch-tools.mjs

# Mirrored by src/engine/runtime-layout.ts — change both together.
extraResources:
  - from: ../server/dist/server.cjs
    to: server/server.cjs
  - from: ../renderer/dist
    to: renderer
  - from: tools/${os}
    to: tools
  - from: third-party
    to: third-party

# Drawn from assets/icon.svg by `npm run icons` (scripts/icons/draw-icons.ts). The installer,
# the uninstaller and the shortcuts take the exe's.
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

# Where an installed Scia looks for its updates (docs/adr/0007-automatic-updates.md). Also what makes
# electron-builder write latest.yml and the blockmap beside the installer, with --publish never,
# and app-update.yml inside the app.
publish:
  provider: github
  owner: m-bonanno
  repo: scia

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Scia
  # The history and the unfinished downloads must survive an uninstall.
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icons
  category: Network
  # The .deb needs one; without it electron-builder asks for an e-mail in package.json.
  maintainer: Scia
  artifactName: ${productName}-${version}.${ext}
