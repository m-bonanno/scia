name: 🐛 Bug
description: Something does not work as it should.
title: 'fix: '
labels: ['bug', 'status:triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. **Do not paste private links or links with tokens** (personal download addresses, debrid service keys): describe the kind of link instead.
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Describe the problem as you see it, with the exact message if there is one.
      placeholder: 'A 4 GB download stops at 99% and stays "Queued".'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The steps, one per line.
      placeholder: |
        1. Paste a link to a big file
        2. Pause halfway
        3. Close and reopen Scia
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      options:
        - App (Windows)
        - App (Linux)
        - Browser extension
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of Scia
      description: At the bottom of Settings.
      placeholder: '1.2.0'
  - type: textarea
    id: log
    attributes:
      label: Technical details
      description: The last lines of `logs/main.log` in Scia's data folder, if you can. Remove user names and private addresses.
      render: text
