name: ✨ Proposal
description: A new feature or an improvement.
title: 'feat: '
labels: ['enhancement']
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What you want to do and cannot today, or can only with effort. The problem before the solution.
      placeholder: 'I often download at night: I would like downloads to start by themselves at a given time.'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you imagine it
      description: If you have an idea of how it should work. Scia stays minimal, so a new feature has to earn its place.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What must be verifiable for the request to be closed.
      placeholder: |
        - [ ] …
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Download engine
        - Interface
        - Browser extension
        - Debrid services
        - Installation and updates
        - Development and CI
    validations:
      required: true
