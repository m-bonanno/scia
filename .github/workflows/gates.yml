name: Gates

# The gates of docs/development/review-flow.md, on every PR and — called by release.yml — on the
# commit a merge into develop or main made, before it is tagged (docs/adr/0008-the-delivery-pipeline.md).
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

# A new push to a PR replaces its run; a release's run is never cancelled.
concurrency:
  group: gates-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Its name is a required check of develop and main: renaming it blocks every PR.
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No spec of these layers starts Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Scia ships for Windows: its timers, paths and processes are Windows'. Format, lint and types
  # say the same on both systems and run once, above.
  windows:
    name: Windows tests, build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # No spec of these layers starts Electron; the E2E job (#91) is to download it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # The built app, started by Electron on the system it ships for, against local hosts only
  # (docs/development/testing.md, "E2E").
  e2e:
    name: E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Electron is pinned in apps/desktop/package.json: its download changes only with it.
      - name: Cache Electron's download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
      - name: Install
        run: npm ci
      # Fetched here, from the cache when it holds it, rather than at the first spec's start, inside
      # its time limit: npm ci can leave the binary to the first use (.claude/gotchas.md, Tooling).
      - name: Electron's binary
        run: node node_modules/electron/install.js
      - name: Build
        run: npm run build
      - name: E2E
        run: npm run test:e2e
